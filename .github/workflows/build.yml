# Builds and tests Varta on Linux and Windows. The Windows job produces a ready-to-install
# package (artifact "Varta-windows-x64"): vartad.exe + WinDivert + varta-gui.exe with Qt.
#
# The macOS job builds Varta-<version>-macos-x64.zip (Varta.app + install.sh) and runs vartad
# as root on the runner to check packet capture and pf blocking for real.
#
# Releases: push a tag v<version> (the same number as project(VERSION) in CMakeLists.txt).
# The release job then publishes Varta-<version>-windows-x64.zip as a GitHub Release, which
# the GUI's update check finds. Release notes: docs/RELEASE_NOTES_v<version>.md if present.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^project(varta VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match CMakeLists.txt version $v"; exit 1
          fi
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libnetfilter-queue-dev qt6-base-dev qt6-tools-dev qt6-l10n-tools
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    env:
      WINDIVERT_VERSION: 2.2.2
      # SHA-256 of the official WinDivert-2.2.2-A.zip from github.com/basil00/WinDivert/releases
      WINDIVERT_SHA256: 63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          archives: qtbase qttools qttranslations
          cache: true

      - name: Download WinDivert
        shell: pwsh
        run: |
          $zip = "WinDivert.zip"
          Invoke-WebRequest "https://github.com/basil00/WinDivert/releases/download/v$env:WINDIVERT_VERSION/WinDivert-$env:WINDIVERT_VERSION-A.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINDIVERT_SHA256) { throw "WinDivert checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath third_party
          Rename-Item "third_party/WinDivert-$env:WINDIVERT_VERSION-A" WinDivert

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "Varta-windows-x64"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item build/Release/vartad.exe, build/Release/varta.exe, build/gui/Release/varta-gui.exe $out
          Copy-Item third_party/WinDivert/x64/WinDivert.dll, third_party/WinDivert/x64/WinDivert64.sys $out
          Copy-Item third_party/WinDivert/LICENSE "$out/WinDivert-LICENSE.txt"
          Copy-Item packaging/windows/*.ps1, packaging/windows/*.cmd, LICENSE, README.md $out
          windeployqt --release --no-compiler-runtime "$out/varta-gui.exe"
          # MSVC runtime: ship the redistributable DLLs next to the programs.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" $out

      - uses: actions/upload-artifact@v4
        with:
          name: Varta-windows-x64
          path: Varta-windows-x64

      - name: Release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          $name = "Varta-$ver-windows-x64"
          Rename-Item Varta-windows-x64 $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-zip-windows
          path: Varta-*-windows-x64.zip
          if-no-files-found: error

  macos:
    # Intel runner: the package is built for x86_64 Macs (macOS 12 or newer).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test (vartad as root, pf and packet capture for real)
        run: |
          set -x
          mkdir -p /tmp/vcfg
          # Only curl is denied; everything else (the runner itself!) passes: no GUI -> allow.
          echo '{"version":1,"rules":[{"enabled":true,"action":"deny","duration":"forever","exe":"/usr/bin/curl"}]}' \
               > /tmp/vcfg/app-rules.json
          sudo ./build/vartad --verbose --config-dir /tmp/vcfg --data-dir /tmp/vdata --run-dir /tmp/vrun \
               > /tmp/vartad.log 2>&1 &
          sleep 6
          curl -s -m 10 -o /dev/null http://1.1.1.1/ || true   # seen by vartad and denied
          sleep 3
          blocked=0
          curl -s -m 10 -o /dev/null http://1.1.1.1/ || blocked=1
          sudo pfctl -a com.apple/varta_ask -t varta_deny -T show || true
          sudo pkill -INT -x vartad || true
          sleep 3
          cat /tmp/vartad.log
          grep -q "deny  /usr/bin/curl -> .*1.1.1.1:80" /tmp/vartad.log
          test "$blocked" = 1
          # rules are removed again on shutdown
          test -z "$(sudo pfctl -a com.apple/varta_ask -s rules 2>/dev/null)"

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER=dev; fi
          NAME="Varta-$VER-macos-x64"
          "$QT_ROOT_DIR/bin/macdeployqt" build/gui/varta-gui.app
          cp build/vartad build/gui/varta-gui.app/Contents/MacOS/
          mkdir "$NAME"
          ditto build/gui/varta-gui.app "$NAME/Varta.app"
          # Ad-hoc signature over the whole bundle (vartad was added after macdeployqt).
          codesign --force --deep -s - "$NAME/Varta.app"
          cp packaging/macos/install.sh packaging/macos/uninstall.sh LICENSE README.md "$NAME/"
          ditto -c -k --keepParent "$NAME" "$NAME.zip"
          echo "PKG=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Varta-macos-x64
          path: ${{ env.PKG }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-zip-macos
          path: ${{ env.PKG }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-zip-*
          merge-multiple: true
          path: artifacts
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="docs/RELEASE_NOTES_${TAG}.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --title "Varta ${TAG#v}" --notes-file "$NOTES"
            else
              gh release create "$TAG" --title "Varta ${TAG#v}" --generate-notes
            fi
          fi
          gh release upload "$TAG" artifacts/*.zip --clobber
